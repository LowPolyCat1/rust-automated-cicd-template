name: Compilation Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pull requests are compared against their base, pushes against the previous commit.
  # The gate is job-level (not `on.pull_request.paths`) so that skipped required
  # checks are still reported as successful. If the filter itself fails, `run` is
  # empty and everything runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      # Pull requests are diffed through the API; pushes need the git history.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build.yml'

  build:
    # Matrix jobs can't be skipped with a job-level `if`: GitHub then reports a single
    # unexpanded check instead of one per matrix entry, so the required
    # `build (<os>, stable)` checks would never be reported. The steps are skipped instead.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, beta, nightly]
    permissions:
      contents: read
    env:
      RUN: ${{ needs.changes.outputs.run != 'false' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        name: Set up Rust
        run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - if: env.RUN == 'true'
        name: Build
        run: cargo build --verbose
      - if: env.RUN == 'true'
        name: Run tests
        run: cargo test --verbose
      - if: env.RUN == 'true'
        name: Build release
        run: cargo build --verbose --release
